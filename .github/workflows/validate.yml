name: ARCHITECTON STRUCT validate
on:
  push:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration
        run: python tools/validate_config.py
      - name: Execute deterministic STRUCT MVP
        run: python tests/test_struct_mvp.py
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm51-struct-mvp-evidence
          path: artifacts/struct_mvp.json
